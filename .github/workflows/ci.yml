name: Enterprise CI Pipeline - SOC Hub

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  infrastructure-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check infrastructure/terraform

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v3

      - name: TFLint Check
        run: |
          cd infrastructure/terraform
          tflint --init
          tflint

      # FIX: SAST Security Scanner für Terraform IaC hinzugefügt
      - name: Bridgecrew Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform
          framework: terraform

  ansible-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # FIX: Molecule Integration für vollautomatisierte Role-Tests vorbereitet
      - name: Install Ansible-Lint and Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-lint molecule molecule-plugins[docker]

      - name: Run Ansible Lint
        run: ansible-lint ansible/site.yml
