---
- name: Loki Grundkonfiguration erstellen
  ansible.builtin.copy:
    dest: /etc/loki/loki.yaml
    content: |
      auth_enabled: false
      server:
        http_listen_port: 3100
      common:
        path_prefix: /var/lib/loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      # FIX: Migration auf Schema v13 (TSDB) mit S3 Object Storage
      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: index_
              period: 24h

      storage_config:
        aws:
          bucketnames: soc-loki-archive
          endpoint: s3.eu-central-1.amazonaws.com
          region: eu-central-1
          access_key_id: ${S3_ACCESS_KEY}
          secret_access_key: ${S3_SECRET_KEY}
        tsdb_shipper:
          active_index_directory: /var/lib/loki/tsdb-index
          cache_location: /var/lib/loki/tsdb-cache

      limits_config:
        retention_period: 30d

      compactor:
        working_directory: /var/lib/loki/compactor
        shared_store: s3
        retention_enabled: true
    owner: loki
    group: loki
    mode: '0644'
