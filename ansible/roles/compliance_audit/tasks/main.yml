---
- name: OpenSCAP Scanner und Security-Guide-Pakete installieren
  ansible.builtin.dnf:
    name:
      - scap-security-guide
      - openscap-scanner
    state: present

- name: Verzeichnis für Compliance-Berichte erstellen
  ansible.builtin.file:
    path: /var/log/compliance
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: OpenSCAP CIS-Compliance-Scan ausführen
  ansible.builtin.command:
    cmd: >
      oscap xccdf eval 
      --profile xccdf_org.ssgproject.content_profile_cis 
      --results /var/log/compliance/oscap-results.xml 
      --report /var/log/compliance/oscap-report.html 
      /usr/share/xml/scap/ssg/content/ssg-rocky9-ds.xml
  register: oscap_scan
  failed_when: oscap_scan.rc > 2
  changed_when: false

- name: Zusammenfassung des Compliance-Scans im Log ausgeben
  ansible.builtin.debug:
    msg: "OpenSCAP Audit auf dem SOC-Hub abgeschlossen. HTML-Report liegt unter /var/log/compliance/oscap-report.html bereit."
